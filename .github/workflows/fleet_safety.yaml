name: Fleet controller safety

on:
  workflow_dispatch:
    inputs:
      strict_audit:
        description: "Fail on pre-existing unbaselined gaps/errors instead of regressions only"
        type: boolean
        default: false
        required: false
  pull_request:
    paths:
      - 'opendbc_repo/**'
      - 'selfdrive/car/**'
      - 'starpilot/car/**'
      - 'starpilot/controls/**'
      - 'cereal/**'
      - '.github/workflows/fleet_safety.yaml'

permissions:
  contents: read

jobs:
  harness:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r selfdrive/car/tests/fleet_requirements.txt
      - name: Audit accounting, runner failures, and GM controller tests
        run: >-
          python -m pytest --noconftest -o addopts='' -q
          selfdrive/car/tests/test_fleet_safety_core.py
          selfdrive/car/tests/test_fleet_safety_runner.py
          opendbc_repo/opendbc/safety/tests/safety_replay/test_replay_drive.py
          opendbc_repo/opendbc/car/gm/tests/test_carcontroller.py
      - name: Compile Panda safety for STM32F4 and CANFD
        working-directory: opendbc_repo
        shell: bash
        run: |
          set -euo pipefail
          COMMON_FLAGS=(-c -o /dev/null -Os -Wall -Wextra -Werror -Wno-strict-prototypes -nostdlib -fno-builtin -std=gnu11 -fmax-errors=1 -I. -I.. -I../panda -x c opendbc/safety/tests/libsafety/safety.c)
          gcc -DALLOW_DEBUG -DSTM32F4 "${COMMON_FLAGS[@]}"
          gcc -DALLOW_DEBUG "${COMMON_FLAGS[@]}"
          gcc -Wno-unused-variable -DSTM32F4 "${COMMON_FLAGS[@]}"
          gcc -Wno-unused-variable "${COMMON_FLAGS[@]}"
  recorded_fleet:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r selfdrive/car/tests/fleet_requirements.txt
      - name: Current controllers against freshly compiled release safety
        shell: bash
        env:
          STRICT_AUDIT: ${{ github.event_name == 'workflow_dispatch' && inputs.strict_audit && '1' || '0' }}
        run: |
          set -euo pipefail
          EXTRA_ARGS=(--baseline selfdrive/car/tests/fleet_safety_baseline.json)
          if [[ "${STRICT_AUDIT}" == "1" ]]; then
            EXTRA_ARGS=()
          fi
          python -m selfdrive.car.tests.fleet_safety --all --release \
            --shard-count 8 --shard-index "${{ matrix.shard }}" \
            --out selfdrive/car/tests/fleet_results/ci \
            "${EXTRA_ARGS[@]}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fleet-safety-${{ matrix.shard }}
          path: |
            selfdrive/car/tests/fleet_results/ci/**/*.json
            selfdrive/car/tests/fleet_results/ci/**/*.log
